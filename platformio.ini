[platformio]
default_envs = sensor, gateway
src_dir = .
include_dir = shared/include

[env]
framework = arduino
monitor_speed = 115200
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
build_unflags = -std=gnu++11 -std=gnu++17 -std=gnu++2a -std=gnu++2b
build_flags =
    -std=gnu++23
    -I third_party/glaze/include

; =====================================================================
; Smart Chair Sensor Node (Target: ESP32-C3 SuperMini)
; =====================================================================
[env:sensor]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensor/src/> +<shared/src/>
build_flags =
    ${env.build_flags}
    -I sensor/include
    -I shared/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; =====================================================================
; Desk Gateway Receiver (Target: ESP32-S3 DevKit)
; =====================================================================
; JSON runs on UART1 (TX GPIO17, RX GPIO18), wired to the Pi's GPIO14/15 UART. The native
; USB port still flashes the board but carries no JSON; UART0 stays the boot console.
[env:gateway]
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<gateway/src/> +<shared/src/>
build_flags =
    ${env.build_flags}
    -I gateway/include
    -I shared/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CHAIR_UART_TX_PIN=17
    -D CHAIR_UART_RX_PIN=18

; MAC-only provisioning firmware; no peer configuration, sensing or ESP-NOW.
[env:mac-sensor]
extends = env:sensor
build_src_filter = -<*> +<tools/mac_address/>

; Prints through the native USB port, unlike the UART gateway application.
[env:mac-gateway]
extends = env:gateway
build_src_filter = -<*> +<tools/mac_address/>
build_flags =
    ${env.build_flags}
    -I gateway/include
    -I shared/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Explicitly provision a disposable sensor's v2 state. Does not run during normal boot.
[env:reset-sensor]
extends = env:sensor
build_src_filter = -<*> +<tools/reset_sensor/>

; USB diagnostics preserve normal timing. Never needed for a production deployment.
[env:sensor-diagnostics]
extends = env:sensor
build_flags =
    ${env:sensor.build_flags}
    -D CHAIR_DIAGNOSTICS=1

; Deliberately slow startup to reproduce a motion stop before radio readiness.
; Restore env:sensor after the bench test; this is not power-measurement firmware.
[env:sensor-window-test]
extends = env:sensor-diagnostics
build_flags =
    ${env:sensor-diagnostics.build_flags}
    -D CHAIR_RADIO_START_DELAY_MS=1800
