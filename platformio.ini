[platformio]
default_envs = sensor, gateway
src_dir = .
include_dir = shared/include

[env]
framework = arduino
monitor_speed = 115200
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
build_unflags = -std=gnu++11 -std=gnu++17 -std=gnu++2a -std=gnu++2b
build_flags =
    -std=gnu++23
    -I third_party/glaze/include

; =====================================================================
; Smart Chair Sensor Node (Target: ESP32-C3 SuperMini)
; =====================================================================
[env:sensor]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensor/src/> +<shared/src/>
build_flags =
    ${env.build_flags}
    -I sensor/include
    -I shared/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; =====================================================================
; Desk Gateway Receiver (Target: ESP32-S3 DevKit)
; =====================================================================
[env:gateway]
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<gateway/src/> +<shared/src/>
build_flags =
    ${env.build_flags}
    -I gateway/include
    -I shared/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; MAC-only provisioning firmware; no peer configuration, sensing or ESP-NOW.
[env:mac-sensor]
extends = env:sensor
build_src_filter = -<*> +<tools/mac_address/>

[env:mac-gateway]
extends = env:gateway
build_src_filter = -<*> +<tools/mac_address/>

; Explicitly provision a disposable sensor's v2 state. Does not run during normal boot.
[env:reset-sensor]
extends = env:sensor
build_src_filter = -<*> +<tools/reset_sensor/>
