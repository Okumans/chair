[platformio]
default_envs = sensor, gateway
src_dir = .
include_dir = shared/include

[env]
framework = arduino
monitor_speed = 115200

; =====================================================================
; Smart Chair Sensor Node (Target: ESP32-C3 SuperMini)
; =====================================================================
[env:sensor]
platform = espressif32
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensor/src/>
build_flags = 
    -I sensor/include
    -I shared/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; =====================================================================
; Desk Gateway Receiver (Target: ESP32-S3 DevKit)
; =====================================================================
[env:gateway]
platform = espressif32
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<gateway/src/>
build_flags = 
    -I gateway/include
    -I shared/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
