[platformio]
default_envs = esp32-c3-supermini

; Common settings shared across environments
[env]
framework = arduino
monitor_speed = 115200

; Target: ESP32-C3 SuperMini (Compact node prototype)
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_C3_SUPERMINI

; Target: ESP32-S3 DevKit (Bench-test board)
[env:esp32-s3-bench]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_S3_BENCH
