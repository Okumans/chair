name: Set up chair checks
description: Install the pinned toolchain that `make check` needs.

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends make g++ mosquitto openssl

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # Pinned to the maintainer's versions so formatting never drifts with the runner.
    - name: Install formatters
      shell: bash
      run: |
        uv tool install clang-format==23.1.5
        uv tool install ruff==0.17.6
        uv tool dir --bin >> "$GITHUB_PATH"

    # Hook tests create throwaway repositories and commit to them.
    - name: Configure git identity
      shell: bash
      run: |
        git config --global user.name "chair-ci"
        git config --global user.email "chair-ci@users.noreply.github.com"

    # Ubuntu's AppArmor profile only lets mosquitto read its own config directories, but
    # the broker tests start it from a temporary config file. Unload the profile on this
    # throwaway runner.
    - name: Let Mosquitto read test configs
      shell: bash
      run: |
        sudo systemctl disable --now mosquitto || true
        for profile in $(grep -l '/usr/sbin/mosquitto' /etc/apparmor.d/* 2>/dev/null); do
          sudo apparmor_parser -R "$profile"
        done

    # The broker tests start a private Mosquitto from a temporary config; fail early, with
    # its own error output, if this runner cannot do that.
    - name: Check a private Mosquitto starts
      shell: bash
      run: |
        dir=$(mktemp -d)
        printf 'listener 18830 127.0.0.1\nallow_anonymous true\npersistence false\n' > "$dir/mosquitto.conf"
        mosquitto -v -c "$dir/mosquitto.conf" > "$dir/broker.log" 2>&1 &
        broker=$!
        for _ in $(seq 50); do
          if (exec 3<>/dev/tcp/127.0.0.1/18830) 2>/dev/null; then kill "$broker"; exit 0; fi
          sleep 0.1
        done
        echo "::error::private Mosquitto did not start"
        cat "$dir/broker.log"
        ls -l "$(command -v mosquitto)"
        sudo aa-status 2>/dev/null | grep -i mosquitto || true
        exit 1

    - name: Show toolchain
      shell: bash
      run: |
        c++ --version | head -1
        clang-format --version
        ruff --version
        uv --version
